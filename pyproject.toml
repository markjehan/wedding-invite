# For Vercel: the guest server's packages, and where its Django app is. The same list is in
# server/requirements.txt for the laptop's server/.venv; change both together.
[project]
name = "wedding-invite"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-allauth[mfa]>=65.21,<66",
    "openpyxl>=3.1,<4",
    "whitenoise>=6.9,<7",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "server.config.wsgi:application"

# Every deploy brings the database's tables up to date before it goes live.
[tool.vercel.scripts]
build = "python server/manage.py migrate --noinput"
